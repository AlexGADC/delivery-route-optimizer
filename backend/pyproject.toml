[project]
name = "delivery-route-optimizer-backend"
version = "0.1.0"
description = "Solvers and API for a delivery route optimizer with time windows"
requires-python = ">=3.14"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
